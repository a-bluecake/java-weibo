<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布评论</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #fdf2f4;
            min-height: 100vh;
            padding: 20px;
        }

        .comment-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(230, 22, 45, 0.08);
            padding: 30px;
        }

        .page-title {
            color: #b91c1c;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #fee2e2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #e6162d;
        }

        .comment-input {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #fee2e2;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            color: #333;
            line-height: 1.6;
        }

        .comment-input::placeholder {
            color: #f87171;
            opacity: 0.7;
        }

        .comment-input:focus {
            outline: none;
            border-color: #e6162d;
            box-shadow: 0 0 0 3px rgba(230, 22, 45, 0.08);
        }

        /* 按钮样式 */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .publish-btn {
            background-color: #e6162d;
            color: white;
            box-shadow: 0 2px 5px rgba(230, 22, 45, 0.2);
        }

        .publish-btn:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(230, 22, 45, 0.25);
        }

        .back-btn {
            background-color: white;
            color: #e6162d;
            border: 2px solid #fee2e2;
        }

        .back-btn:hover {
            background-color: #fff5f5;
            border-color: #fecaca;
            transform: translateY(-2px);
        }

        @media (max-width: 576px) {
            .comment-container {
                padding: 20px 15px;
                margin: 20px auto;
            }

            .page-title {
                font-size: 20px;
            }

            .action-btn {
                padding: 8px 18px;
                font-size: 14px;
            }

            .action-btn span {
                display: none;
            }

            .action-btn i {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
<div class="comment-container">
    <h1 class="page-title">
        <i class="fa fa-commenting-o"></i>
        发布评论
    </h1>

    <textarea
            class="comment-input"
            placeholder="请输入评论内容..."
            v-model="comment.content"
    ></textarea>

    <div class="button-group">
        <button class="action-btn back-btn" @click="goToDetailsPage()">
            <i class="fa fa-arrow-left"></i>
            <span>返回</span>
        </button>
        <button class="action-btn publish-btn" @click="publish()">
            <i class="fa fa-paper-plane"></i>
            <span>发布</span>
        </button>
    </div>
</div>
<script src="https://cdn.bootcss.com/axios/0.18.0/axios.min.js"></script>
<script src="https://cdn.staticfile.org/vue/2.2.2/vue.min.js"></script>
<script>
    let v = new Vue({
        el:"body>div",
        data:{
            comment: {
                content:""
            }
        },
        methods:{
            publish(){
                axios.post("/v1/users/publishComment",this.comment)
                    .then(
                        function (response){
                            if(response.data==1){
                                alert("发布成功")
                                location.href = "detailspage.html"
                            }
                            else if (response.data==2){
                                alert("用户没有登录")
                                location.href = "login.html"
                            }
                            else if (response.data==3){
                                alert("未查询到该微博")
                                location.href = ""
                            }
                            else if (response.data==0){
                                alert("出错了")
                            }
                        }
                    )
                    .catch(
                        function(error) {
                            alert("请求失败，请检查网络")
                            console.error(error)
                        }
                    )
            },
            goToDetailsPage(){
                location.href = "detailspage.html";
            }
        }
    })
</script>
</body>
</html>
